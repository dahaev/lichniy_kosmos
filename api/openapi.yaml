openapi: 3.1.0
info:
  title: Личный космос 2.0 API
  version: 0.4.0-6
  description: |
    Контракт frontend/backend — единственный источник истины (ARCHITECTURE_MVP_v2 §15).
    Срез S0: служебные проверки и публичная конфигурация; V1.2: места; V2: проверка
    анкеты (`profile-checks`, пока только MSW-мок); 5: сессия и кодовый вход
    (`session`, `auth/code`, пока только MSW-мок); 6: создание заказа
    (`orders`, пока только MSW-мок; реальное создание закрыто `legal_ready`) и чтение
    заказа (`GET /orders/{id}`, `GET /orders/{id}/reading`; SCR-06, пока только MSW-мок).
    Эндпоинты домена добавляются в контракт до реализации и до MSW-моков (§16.6).

    Правила карты (орбисы, точность расчёта по интервалу времени, пограничные правила,
    допустимая широта — Q4) не утверждены; контракт описывает форму данных, а не эти
    параметры.

    Ошибки — application/problem+json (RFC 9457) со стабильным полем `code`.
servers:
  - url: /
tags:
  - name: ops
    description: Проверки живости и готовности
  - name: config
    description: Публичная конфигурация клиента
  - name: places
    description: Справочник мест рождения
  - name: intake
    description: Проверка анкеты рождения
  - name: auth
    description: Текущая сессия и кодовый вход
  - name: orders
    description: Создание заказа (расход доступа и постановка генерации) и чтение готового заказа

paths:
  /healthz:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Живость процесса
      responses:
        '200':
          description: Процесс отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      tags: [ops]
      operationId: getReadiness
      summary: Готовность обслуживать запросы (БД доступна, миграции применены)
      responses:
        '200':
          description: Все проверки пройдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Хотя бы одна проверка не пройдена; подробности только в логах
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /api/v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Публичная конфигурация и флаги доступных сценариев
      responses:
        '200':
          description: Текущая конфигурация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/places:
    get:
      tags: [places]
      operationId: searchPlaces
      summary: Поиск населённого пункта по началу названия
      description: |
        Публичный, с лимитом частоты (§15.2). Сортировка по совпадению и
        населению; не больше 20 мест. Пустой список — не ошибка.
      parameters:
        - name: q
          in: query
          required: true
          description: Начало названия, от 2 символов после обрезки пробелов
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Найденные места
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceList'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/places/{id}:
    get:
      tags: [places]
      operationId: getPlace
      summary: Одно место справочника
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Место
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/profile-checks:
    post:
      tags: [intake]
      operationId: checkProfile
      summary: Проверить анкету без сохранения
      description: |
        Публичный, с лимитом частоты (§15.2). Вызывается на `/create/review`
        (§8.3): сервер повторяет правила анкеты, разрешает место по `place_id`
        и проверяет локальное время на переход часов (§12.2). Ничего не
        сохраняет, заказ не создаёт, доступ не расходует.

        Нарушение правила значения — `422` с `fields`: ключ — путь поля
        запроса (`name`, `birth_date`, `place_id`, `time.value`, `time.source`,
        `time.accuracy_minutes`), значение — текст на русском для показа у
        поля. `400` — только тело, которое нельзя разобрать: не JSON,
        неизвестные поля, неверная структура.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Анкета корректна; возвращается нормализованной вместе с местом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileCheck'
        '400':
          description: Тело не разобрано (`validation_failed`, без `fields`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Анкета не прошла проверку. `code`: `validation_failed`,
            `place_not_found` (поле `place_id`), `birth_time_nonexistent` или
            `birth_time_ambiguous` (поле `time.value`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит частоты (`rate_limited`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Текущий принципал
      description: |
        Доступен любому посетителю (§15.2), всегда `200`. Без действующей
        cookie `__Host-lk_sid` — `anonymous`. Сессия заблокированного или
        привязанного к аккаунту доступа недействительна (§9.2) — тоже
        `anonymous`. Код целиком никогда не возвращается, только маска.
        Вариант `account` добавляется в срезе 7.
      responses:
        '200':
          description: Принципал текущей сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/code:
    post:
      tags: [auth]
      operationId: startCodeSession
      summary: Кодовый вход
      description: |
        Публичный, с лимитами попыток на IP и глобально (§10.3, «Перебор
        кодов»). Сервер нормализует ввод (регистр, пробелы, дефисы, похожие
        символы) и проверяет префикс, длину и контрольный символ (§10.1).
        Вход не создаёт заказ и не расходует доступ.

        Действующую сессию другого доступа сервер заменяет только при
        `replace_session: true`; иначе — `409 session_conflict`. Повтор кода
        того же доступа — `200` без конфликта. Любая ошибка оставляет
        текущую сессию без изменений.

        Использованный код даёт кодовую сессию и `order_id`; открыть заказ
        можно только с этой сессией (§9.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeLogin'
      responses:
        '200':
          description: Кодовая сессия выдана (или уже действует для этого доступа)
          headers:
            Set-Cookie:
              description: '`__Host-lk_sid`; HttpOnly, Secure, SameSite=Lax, Path=/'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSession'
        '400':
          description: Тело не разобрано (`validation_failed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Доступ привязан к аккаунту (`code_bound_to_account`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Действует сессия другого доступа, а `replace_session` не `true`
            (`session_conflict`). Текущая сессия не меняется.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `code_malformed` — ввод не разбирается как код 2.0, `detail`
            подсказывает про коды старого сайта (§26); `code_invalid` — единый
            ответ для неизвестного, не выпущенного, заблокированного кода и
            кода другого продукта.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит попыток (`rate_limited`)
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создать заказ
      description: |
        Единственная точка, где расходуется доступ (§11). Требует сессию с
        доступом `available`; защита от подделки запроса — как у остальных
        изменяющих методов (§9.4).

        Сервер повторно проверяет анкету, разрешает место, считает карту вне
        транзакции и затем одной транзакцией создаёт заказ, помечает доступ
        использованным и ставит генерацию в очередь. Ответ `201`/`200` значит
        «заказ создан и поставлен в очередь» (`queued`), а не «разбор готов»:
        исход генерации читается отдельно.

        Идемпотентность. Ключ `Idempotency-Key` и тело запроса образуют
        отпечаток; в него входят `entitlement_id`, `profile` и
        `consent_version`. Тот же ключ и тот же отпечаток возвращают тот же
        заказ (`200`, а у самого первого запроса — `201`). Тот же ключ с
        другим отпечатком — `409 idempotency_key_reused`, новый заказ не
        создаётся. Клиент при неизвестном исходе (сеть, таймаут, `5xx`)
        повторяет запрос только с тем же ключом.

        Реальное создание закрыто, пока `PublicConfig.legal_ready = false`
        или `features.generation = false`: ответ `403 creation_unavailable`,
        ничего не создано, доступ не тронут. Сервер проверяет это
        независимо от клиента. Версия согласия сверяется с серверной под
        блокировкой доступа (`409 consent_outdated`).

        Определённые отказы до создания заказа (`4xx`) оставляют доступ
        `available`. Заказ при окончательной неудаче генерации подлежит
        восстановлению или административному разбору; доступ автоматически
        не освобождается (инвариант «один доступ — максимум один заказ»).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Ключ повтора, 16–80 символов `[A-Za-z0-9_-]`; клиент хранит его до подтверждённого ответа
          schema:
            type: string
            minLength: 16
            maxLength: 80
            pattern: '^[A-Za-z0-9_-]{16,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Заказ создан, доступ использован, генерация поставлена в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '200':
          description: Повтор того же запроса (или заказ уже создан по тому же доступу с той же анкетой); тот же заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '400':
          description: Тело не разобрано или нет корректного `Idempotency-Key` (`validation_failed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Нет действующей сессии (`unauthenticated`); заказ не создан
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: |
            Создание сейчас недоступно (`creation_unavailable`): юридический
            допуск не получен или генерация выключена. Ничего не создано,
            доступ `available`. Это определённый отказ, не неизвестный исход.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            `entitlement_id` не принадлежит текущей сессии (`not_found`); о
            чужих доступах сервер ничего не раскрывает. Заказ не создан.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `consent_outdated` — версия согласия устарела; `entitlement_used`
            — по доступу уже создан другой заказ (`order_id` читается из
            `GET /api/v1/session`); `entitlement_blocked` — доступ
            заблокирован; `idempotency_key_reused` — тот же ключ с другим
            запросом. Новый заказ не создан.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Анкета не прошла проверку или карта не рассчитана. `code`:
            `validation_failed`, `place_not_found`, `birth_time_nonexistent`,
            `birth_time_ambiguous` (с `fields`, как у `profile-checks`) или
            `calculation_failed`. Заказ не создан, доступ `available`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит частоты (`rate_limited`)
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Заказ — карта, статус, минимальный профиль, метаданные генерации и файлов
      description: |
        Единственный ресурс, который опрашивает SCR-06 и читает SCR-07. Полный
        текст разбора сюда не входит — он отдельный ресурс
        (`GET /api/v1/orders/{id}/reading`), чтобы не передавать его в каждом
        ответе опроса.

        Доступ. Право читать существующий заказ проверяется независимо от права
        создавать новые: закрытый `legal_ready`/`features.generation`, исчерпанный
        или заблокированный доступ чтение не отключают. Читать можно только заказ
        своего доступа (кодовая сессия) или своих доступов (аккаунт, срез 7).
        Чужой и несуществующий заказ, а также `id`, не являющийся UUID, дают один
        и тот же `404 not_found` (§9.5).

        Кеш и опрос. Ответ — `Cache-Control: no-store`, `Vary: Cookie`, `ETag`
        слабый (`W/"…"`) от сериализованного представления, куда входит
        вычисленный статус: пауза очереди меняет `ETag`, хотя заказ не менялся.
        Значение `ETag` непрозрачно, клиент его не разбирает. Клиент сам хранит
        последний `ETag` и тело и шлёт `If-None-Match`; при совпадении — `304`
        без тела. `304` — штатный исход опроса, не ошибка.

        Лимит частоты на сессию с запасом над расписанием опроса; превышение —
        `429 rate_limited` с `Retry-After` (в том числе для `304`-запросов).
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Текущее состояние заказа
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/orders/{id}/reading:
    get:
      tags: [orders]
      operationId: getOrderReading
      summary: Готовый текст разбора
      description: |
        Отдельный ресурс: содержимое принятого текста (§13, `generation.readings`).
        Доступен, как только `Order.generation.reading_ready = true` — в том числе
        пока иллюстрация ещё готовится, и в `failed_retryable`/`needs_review`, если
        текст уже принят. Текст неизменяем после принятия.

        Доступ, `404`, `ETag`/`304`, `Cache-Control` и лимит частоты — как у
        `GET /api/v1/orders/{id}`. Если текст ещё не принят — `409
        reading_not_ready` (заказ существует и читается, но ресурса пока нет).

        Контракт минимальный: состав разбора (вопросы, visual concept, символы,
        версии схемы) уточняется вместе с SCR-07 и до этого не расширяется.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Принятый текст разбора
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: Текст ещё не принят (`reading_not_ready`); заказ существует
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: |
        Идентификатор заказа. Значение, не являющееся UUID, обрабатывается как
        несуществующий заказ (`404 not_found`), а не как ошибка запроса.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '`ETag` последнего полученного ответа; при совпадении сервер отвечает `304` без тела'
      schema:
        type: string
        maxLength: 256

  headers:
    ETag:
      required: true
      description: Слабый валидатор представления, `W/"…"`; непрозрачен для клиента
      schema:
        type: string
    CacheControlNoStore:
      required: true
      description: Всегда `no-store` (§15.1); условные запросы клиент делает сам
      schema:
        type: string
        enum: [no-store]
    RetryAfter:
      description: Через сколько секунд можно повторить
      schema:
        type: integer
        minimum: 1

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: |
        Представление не изменилось с `If-None-Match`. Без тела; `ETag` и
        `Cache-Control` повторяются. Клиент оставляет прежнее тело.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    Unauthenticated:
      description: |
        Нет действующей сессии (`unauthenticated`): не выдавалась, истекла или
        отозвана (в том числе код привязан к аккаунту, §9.2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OrderNotFound:
      description: |
        Заказа нет, он чужой или `id` не UUID (`not_found`); ответ один и тот же
        во всех трёх случаях.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Превышен лимит частоты (`rate_limited`)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: Имя проверки → результат
          additionalProperties:
            type: string
            enum: [ok, fail]

    PublicConfig:
      type: object
      additionalProperties: false
      required: [environment, features, consent_version, legal_ready]
      properties:
        environment:
          type: string
          enum: [local, test, staging, production]
        features:
          $ref: '#/components/schemas/Features'
        consent_version:
          type: string
          description: |
            Текущая серверная версия согласия на создание разбора (§11.2,
            `POST /api/v1/orders`). Пока юридический текст не утверждён (Q12),
            значение может быть пустым: клиент тогда ничего не отправляет.
        legal_ready:
          type: boolean
          description: |
            Юридический допуск получен: утверждены тексты согласия и документы.
            По умолчанию `false`; при `false` создание заказа закрыто, а
            `POST /api/v1/orders` отвечает `403 creation_unavailable`. Клиентский
            флаг не заменяет проверку на сервере.

    Features:
      type: object
      additionalProperties: false
      description: Какие пользовательские сценарии сервер обслуживает сейчас
      required: [code_login, email_login, generation]
      properties:
        code_login:
          type: boolean
        email_login:
          type: boolean
        generation:
          type: boolean

    Place:
      type: object
      additionalProperties: false
      description: Справочное место; координаты и часовой пояс берёт сервер по `id`, клиент их не присылает
      required: [id, name, country, latitude, longitude, timezone]
      properties:
        id:
          type: string
        name:
          type: string
          description: Название на русском
        region:
          type: string
          description: Регион или область, если есть
        country:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: IANA, например Europe/Moscow

    PlaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Place'

    Profile:
      type: object
      additionalProperties: false
      description: Анкета рождения (§15.4); координаты и часовой пояс сервер берёт по `place_id`
      required: [name, birth_date, place_id, time]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: 1–60 символов Unicode после обрезки пробелов
        birth_date:
          type: string
          format: date
          description: YYYY-MM-DD, от 1900-01-01 до текущей московской даты
        place_id:
          type: string
          description: '`Place.id` из справочника'
        time:
          $ref: '#/components/schemas/BirthTime'

    BirthTime:
      description: Явный дискриминатор `kind` вместо пары «время + флаг неизвестности» (§15.4)
      oneOf:
        - $ref: '#/components/schemas/BirthTimeKnown'
        - $ref: '#/components/schemas/BirthTimeUnknown'
      discriminator:
        propertyName: kind
        mapping:
          known: '#/components/schemas/BirthTimeKnown'
          unknown: '#/components/schemas/BirthTimeUnknown'

    BirthTimeKnown:
      type: object
      additionalProperties: false
      required: [kind, value, source, accuracy_minutes]
      properties:
        kind:
          type: string
          enum: [known]
        value:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Местное время HH:MM
        source:
          type: string
          enum: [document, family, approximate]
        accuracy_minutes:
          type: integer
          enum: [0, 15, 30, 60]

    BirthTimeUnknown:
      type: object
      additionalProperties: false
      description: Время неизвестно; сервер считает источник `unknown` и погрешность 0
      required: [kind]
      properties:
        kind:
          type: string
          enum: [unknown]

    ProfileCheck:
      type: object
      additionalProperties: false
      required: [profile, place]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        place:
          $ref: '#/components/schemas/Place'

    CodeLogin:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Код как введён; нормализует сервер (§10.1)
        replace_session:
          type: boolean
          description: Пользователь явно согласился заменить действующую сессию другого доступа; отсутствие поля равно `false`

    Session:
      description: Принципал сессии (§9.1)
      oneOf:
        - $ref: '#/components/schemas/AnonymousSession'
        - $ref: '#/components/schemas/CodeSession'
      discriminator:
        propertyName: principal
        mapping:
          anonymous: '#/components/schemas/AnonymousSession'
          code: '#/components/schemas/CodeSession'

    AnonymousSession:
      type: object
      additionalProperties: false
      required: [principal]
      properties:
        principal:
          type: string
          enum: [anonymous]

    CodeSession:
      type: object
      additionalProperties: false
      required: [principal, expires_at, entitlement]
      properties:
        principal:
          type: string
          enum: [code]
        expires_at:
          type: string
          format: date-time
        entitlement:
          $ref: '#/components/schemas/CodeEntitlement'

    CodeEntitlement:
      description: Доступ кодовой сессии; `order_id` есть только у использованного
      oneOf:
        - $ref: '#/components/schemas/CodeEntitlementAvailable'
        - $ref: '#/components/schemas/CodeEntitlementConsumed'
      discriminator:
        propertyName: state
        mapping:
          available: '#/components/schemas/CodeEntitlementAvailable'
          consumed: '#/components/schemas/CodeEntitlementConsumed'

    CodeEntitlementAvailable:
      type: object
      additionalProperties: false
      required: [id, state, code_mask]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [available]
        code_mask:
          $ref: '#/components/schemas/CodeMask'

    CodeEntitlementConsumed:
      type: object
      additionalProperties: false
      required: [id, state, code_mask, order_id]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [consumed]
        code_mask:
          $ref: '#/components/schemas/CodeMask'
        order_id:
          type: string
          format: uuid
          description: Заказ, созданный по этому доступу

    CodeMask:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{4}$'
      description: Последние 4 символа нормализованного кода (§10.2)

    CreateOrder:
      type: object
      additionalProperties: false
      description: Тело `POST /api/v1/orders` (§11.1); часть отпечатка идемпотентности
      required: [entitlement_id, profile, consent_version]
      properties:
        entitlement_id:
          type: string
          format: uuid
          description: Доступ текущей сессии, который будет использован
        profile:
          $ref: '#/components/schemas/Profile'
        consent_version:
          type: string
          minLength: 1
          description: Версия согласия из `PublicConfig.consent_version`, которую увидел пользователь

    OrderCreated:
      type: object
      additionalProperties: false
      description: |
        Минимальный ответ создания заказа. Карту и состояние читают отдельным
        запросом `GET /api/v1/orders/{id}` (`Order`); `POST` карту не возвращает.
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
          description: Генерация поставлена в очередь; это не готовность разбора

    OrderStatus:
      type: string
      description: |
        Вычисленный статус заказа (§13.6); в заказе не хранится. Порядок
        прохождения: `queued` → `writing` → `illustrating` → `ready`; из любого
        активного состояния возможны `failed_retryable` и `needs_review`.
        `calculated` (карта есть, генерация выключена) в срезе 6 недостижим:
        при выключенной генерации создание закрыто. Клиент обрабатывает его как
        «генерация недоступна», не как ошибку. Процентов прогресса нет.
      enum: [calculated, queued, writing, illustrating, ready, failed_retryable, needs_review]

    Order:
      type: object
      additionalProperties: false
      description: |
        Заказ для SCR-06/07: карта, текущий статус, минимальный профиль,
        метаданные генерации и файлов. Текст разбора не входит (см.
        `GET /api/v1/orders/{id}/reading`). Координаты, часовой пояс и источник
        времени рождения не возвращаются.
      required: [id, status, created_at, profile, chart, generation, files]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/OrderProfile'
        chart:
          $ref: '#/components/schemas/Chart'
        generation:
          $ref: '#/components/schemas/Generation'
        files:
          $ref: '#/components/schemas/OrderFiles'

    OrderProfile:
      type: object
      additionalProperties: false
      description: Минимальный профиль заказа — только то, что экран показывает пользователю
      required: [name, birth_date, place, time]
      properties:
        name:
          type: string
        birth_date:
          type: string
          format: date
        place:
          $ref: '#/components/schemas/OrderPlace'
        time:
          $ref: '#/components/schemas/OrderBirthTime'

    OrderPlace:
      type: object
      additionalProperties: false
      description: Название места из снимка заказа, без координат и часового пояса
      required: [name, country]
      properties:
        name:
          type: string
        region:
          type: string
        country:
          type: string

    OrderBirthTime:
      description: Время рождения, как его указал пользователь (не расчётный интервал карты)
      oneOf:
        - $ref: '#/components/schemas/OrderBirthTimeKnown'
        - $ref: '#/components/schemas/OrderBirthTimeUnknown'
      discriminator:
        propertyName: kind
        mapping:
          known: '#/components/schemas/OrderBirthTimeKnown'
          unknown: '#/components/schemas/OrderBirthTimeUnknown'

    OrderBirthTimeKnown:
      type: object
      additionalProperties: false
      required: [kind, value, accuracy_minutes]
      properties:
        kind:
          type: string
          enum: [known]
        value:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Местное время HH:MM
        accuracy_minutes:
          type: integer
          enum: [0, 15, 30, 60]

    OrderBirthTimeUnknown:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [unknown]

    Generation:
      type: object
      additionalProperties: false
      description: |
        Метаданные генерации. Связи полей:
        `stop_reason` присутствует только при `status = needs_review`;
        `support_reference` — только при `stop_reason = review`;
        `reading_ready = true` при `illustrating` и `ready`, а при
        `failed_retryable`/`needs_review` — если текст принят до остановки;
        `illustration_ready = true` только при `ready`.
      required: [reading_ready, illustration_ready, can_resume]
      properties:
        reading_ready:
          type: boolean
          description: Текст принят и читается через `GET /api/v1/orders/{id}/reading`
        illustration_ready:
          type: boolean
        can_resume:
          type: boolean
          description: |
            Зарезервировано под `POST …/generation/resume` (Q14). Пока вызова
            нет, сервер отдаёт `false`, а клиент ничего не продолжает.
        stop_reason:
          type: string
          enum: [paused, review]
          description: |
            Только при `needs_review`. `paused` — очередь на паузе, генерация
            продолжится без действий пользователя; `review` — ручная проверка,
            есть `support_reference`.
        support_reference:
          type: string
          description: Номер обращения для поддержки; только при `stop_reason = review`

    OrderFiles:
      type: object
      additionalProperties: false
      description: |
        Наличие файлов. `pending` — появится без действий пользователя;
        `unavailable` — файл не ожидается в текущем состоянии заказа (например,
        пока генерация остановлена: `failed_retryable` или `needs_review` с
        `review`); это не окончательный отказ, состояние может смениться.
        Скачивание — `GET …/files/{kind}` (позже).
      required: [txt, png, pdf]
      properties:
        txt:
          $ref: '#/components/schemas/FileAvailability'
        png:
          $ref: '#/components/schemas/FileAvailability'
        pdf:
          $ref: '#/components/schemas/FileAvailability'

    FileAvailability:
      type: string
      enum: [available, pending, unavailable]

    Chart:
      type: object
      additionalProperties: false
      description: |
        Карта, рассчитанная сервером при создании заказа. Клиент не вычисляет
        знаки, интервалы, аспекты, дома и углы: он только показывает присланное.

        Два разных понятия, которые не смешиваются:
        1. Опорная долгота (`ChartBody.reference_longitude`) — положение тела в
           один явно названный момент (`time_basis.reference_moment`). В `range`
           и `unknown` это опорное положение, а не точное.
        2. Неопределённость времени — `mode` и `time_basis`; интервалы долгот
           (`ChartBody.longitude_range`) есть только там, где сервер их
           действительно рассчитал. Отсутствие интервала не означает «точно».

        Ориентация круга: в `known`, если есть `angles`, ASC стоит на 9 часах;
        иначе — 0° Овна. В `range` и `unknown` — всегда 0° Овна. Долготы
        возрастают против часовой стрелки.

        Правила расчёта (орбисы, точность по интервалу, пограничные правила,
        допустимая широта) не утверждены (Q4) и контрактом не фиксируются.
      required: [version, mode, time_basis, bodies, aspects, warnings]
      properties:
        version:
          type: string
          minLength: 1
          description: Версия правил и формата расчёта; непрозрачная строка
        mode:
          $ref: '#/components/schemas/ChartMode'
        time_basis:
          $ref: '#/components/schemas/ChartTimeBasis'
        bodies:
          type: array
          description: Десять тел в порядке Солнце → Плутон
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/ChartBody'
        aspects:
          type: array
          description: |
            Аспекты между телами, как их отобрал сервер. Клиент не пересчитывает
            и не фильтрует. В `range` и `unknown` — только то, что сервер счёл
            устойчивым по интервалу времени.
          items:
            $ref: '#/components/schemas/ChartAspect'
        houses:
          type: array
          description: |
            12 куспидов Плацидуса по номерам. Нет в `unknown`; нет там, где дома
            не определены (в этом случае есть предупреждение `houses_unavailable`).
            В `range` точные дома пока не показываются и могут не присылаться;
            состав не утверждён (Q4).
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/ChartHouse'
        angles:
          $ref: '#/components/schemas/ChartAngles'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ChartWarning'

    ChartMode:
      type: string
      description: |
        `known` — время известно; `range` — известно с погрешностью, расчёт по
        интервалу; `unknown` — время неизвестно.
      enum: [known, range, unknown]

    ChartTimeBasis:
      type: object
      additionalProperties: false
      description: |
        Какому моменту соответствуют опорные долготы и какова неопределённость
        времени. Соответствие режиму: `known` — `birth_moment`; `range` —
        `interval_midpoint`; `unknown` — `local_noon`.
      required: [reference_moment]
      properties:
        reference_moment:
          type: string
          enum: [birth_moment, interval_midpoint, local_noon]
          description: |
            `birth_moment` — момент рождения; `interval_midpoint` — середина
            допустимого интервала времени; `local_noon` — 12:00 местного времени
            рождения. Два последних — опорные положения, не точные.
        uncertainty_minutes:
          type: integer
          minimum: 1
          description: |
            Только при `range`: допустимое отклонение времени в обе стороны от
            середины интервала. Не присылается в `known` и `unknown`.

    Longitude:
      type: number
      minimum: 0
      exclusiveMaximum: 360
      description: Эклиптическая долгота в градусах, тропический зодиак

    BodyId:
      type: string
      enum: [sun, moon, mercury, venus, mars, jupiter, saturn, uranus, neptune, pluto]

    SignId:
      type: string
      enum: [aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]

    ChartBody:
      type: object
      additionalProperties: false
      required: [id, reference_longitude, sign, possible_signs, retrograde]
      properties:
        id:
          $ref: '#/components/schemas/BodyId'
        reference_longitude:
          $ref: '#/components/schemas/Longitude'
        sign:
          $ref: '#/components/schemas/SignId'
          description: Знак опорной долготы
        possible_signs:
          type: array
          description: |
            Знаки, в которых тело может находиться по допустимому интервалу
            времени; определяет только сервер. Всегда содержит `sign`.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SignId'
        retrograde:
          type: [boolean, 'null']
          description: |
            Ретроградность в опорный момент. `null` — сервер не может определить
            признак (в `range`/`unknown` опорный момент может быть днём стояния);
            допустим только в `range` и `unknown`, в `known` всегда `true`/`false`.
            Клиент не подменяет `null` значением `false`.
        longitude_range:
          $ref: '#/components/schemas/LongitudeRange'

    LongitudeRange:
      type: object
      additionalProperties: false
      description: |
        Интервал долгот, рассчитанный сервером по допустимому интервалу времени.
        Необязателен: присутствует только у тел, для которых интервал
        действительно рассчитан; отсутствие не означает, что положение точное.
        Дуга идёт от `from` к `to` по возрастанию долготы; при переходе через 0°
        `from` больше `to`. Содержит `reference_longitude`.
      required: [from, to]
      properties:
        from:
          $ref: '#/components/schemas/Longitude'
        to:
          $ref: '#/components/schemas/Longitude'

    ChartAspect:
      type: object
      additionalProperties: false
      description: |
        Аспект между двумя разными телами. Пара уникальна; `a` стоит раньше `b`
        в порядке тел (Солнце → Плутон). Орбис (`orb_deg`) необязателен: значения
        и правила отбора орбисов не утверждены (Q4), клиент на него не опирается
        и сам не вычисляет.
      required: [a, b, kind]
      properties:
        a:
          $ref: '#/components/schemas/BodyId'
        b:
          $ref: '#/components/schemas/BodyId'
        kind:
          $ref: '#/components/schemas/AspectKind'
        orb_deg:
          type: number
          minimum: 0
          description: |
            Необязательно. Отклонение от точного угла аспекта в градусах, как его
            рассчитал сервер; отсутствие не означает «точно». В `range` и
            `unknown` — только если сервер рассчитал его устойчиво по интервалу.

    AspectKind:
      type: string
      description: Соединение 0°, секстиль 60°, квадрат 90°, трин 120°, оппозиция 180°
      enum: [conjunction, sextile, square, trine, opposition]

    ChartHouse:
      type: object
      additionalProperties: false
      required: [number, longitude]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 12
        longitude:
          $ref: '#/components/schemas/Longitude'

    ChartAngles:
      type: object
      additionalProperties: false
      description: |
        Четыре угла карты присылаются все сразу; клиент DSC и IC не выводит.
        Нет в `unknown`. Присутствие не зависит от домов: при
        `houses_unavailable` углы могут быть. В `range` точные углы пока не
        показываются и могут не присылаться; состав не утверждён (Q4).
      required: [asc, mc, dsc, ic]
      properties:
        asc:
          $ref: '#/components/schemas/Longitude'
        mc:
          $ref: '#/components/schemas/Longitude'
        dsc:
          $ref: '#/components/schemas/Longitude'
        ic:
          $ref: '#/components/schemas/Longitude'

    ChartWarning:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/ChartWarningCode'
        body:
          $ref: '#/components/schemas/BodyId'

    ChartWarningCode:
      type: string
      description: |
        Стартовый перечень; расширяется. Клиент обязан показывать неизвестный код
        нейтральным сообщением, а не падать. Тексты — в клиентском словаре.
        `houses_unavailable` — дома для этого места не определены (подмены
        системы нет); `sign_boundary` — тело `body` у границы знака, знак
        может быть неточным (величина запаса не утверждена, Q4).
      enum: [houses_unavailable, sign_boundary]

    Reading:
      type: object
      additionalProperties: false
      description: Минимальный контракт текста разбора; состав уточняется с SCR-07
      required: [schema_version, word_count, sections]
      properties:
        schema_version:
          type: string
          minLength: 1
        word_count:
          type: integer
          minimum: 0
        sections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReadingSection'

    ReadingSection:
      type: object
      additionalProperties: false
      required: [title, text]
      properties:
        title:
          type: string
        text:
          type: string

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Текст на русском для показа пользователю
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
        fields:
          type: object
          description: Ошибки валидации по полям
          additionalProperties:
            type: string

    ErrorCode:
      type: string
      description: Стабильный машинный код ошибки (§15.3)
      enum:
        - internal_error
        - validation_failed
        - place_not_found
        - birth_time_nonexistent
        - birth_time_ambiguous
        - calculation_failed
        - unauthenticated
        - not_found
        - rate_limited
        - mail_unavailable
        - otp_invalid
        - otp_expired
        - otp_attempts_exceeded
        - code_malformed
        - code_invalid
        - code_bound_to_account
        - code_claimed_elsewhere
        - session_conflict
        - entitlement_used
        - entitlement_blocked
        - consent_outdated
        - creation_unavailable
        - idempotency_key_reused
        - files_not_ready
        - reading_not_ready
        - resume_not_allowed
