openapi: 3.1.0
info:
  title: Личный космос 2.0 API
  version: 0.3.0-5
  description: |
    Контракт frontend/backend — единственный источник истины (ARCHITECTURE_MVP_v2 §15).
    Срез S0: служебные проверки и публичная конфигурация; V1.2: места; V2: проверка
    анкеты (`profile-checks`, пока только MSW-мок); 5: сессия и кодовый вход
    (`session`, `auth/code`, пока только MSW-мок). Эндпоинты домена
    добавляются в контракт до реализации и до MSW-моков (§16.6).

    Ошибки — application/problem+json (RFC 9457) со стабильным полем `code`.
servers:
  - url: /
tags:
  - name: ops
    description: Проверки живости и готовности
  - name: config
    description: Публичная конфигурация клиента
  - name: places
    description: Справочник мест рождения
  - name: intake
    description: Проверка анкеты рождения
  - name: auth
    description: Текущая сессия и кодовый вход

paths:
  /healthz:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Живость процесса
      responses:
        '200':
          description: Процесс отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      tags: [ops]
      operationId: getReadiness
      summary: Готовность обслуживать запросы (БД доступна, миграции применены)
      responses:
        '200':
          description: Все проверки пройдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Хотя бы одна проверка не пройдена; подробности только в логах
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /api/v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Публичная конфигурация и флаги доступных сценариев
      responses:
        '200':
          description: Текущая конфигурация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/places:
    get:
      tags: [places]
      operationId: searchPlaces
      summary: Поиск населённого пункта по началу названия
      description: |
        Публичный, с лимитом частоты (§15.2). Сортировка по совпадению и
        населению; не больше 20 мест. Пустой список — не ошибка.
      parameters:
        - name: q
          in: query
          required: true
          description: Начало названия, от 2 символов после обрезки пробелов
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Найденные места
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceList'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/places/{id}:
    get:
      tags: [places]
      operationId: getPlace
      summary: Одно место справочника
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Место
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/profile-checks:
    post:
      tags: [intake]
      operationId: checkProfile
      summary: Проверить анкету без сохранения
      description: |
        Публичный, с лимитом частоты (§15.2). Вызывается на `/create/review`
        (§8.3): сервер повторяет правила анкеты, разрешает место по `place_id`
        и проверяет локальное время на переход часов (§12.2). Ничего не
        сохраняет, заказ не создаёт, доступ не расходует.

        Нарушение правила значения — `422` с `fields`: ключ — путь поля
        запроса (`name`, `birth_date`, `place_id`, `time.value`, `time.source`,
        `time.accuracy_minutes`), значение — текст на русском для показа у
        поля. `400` — только тело, которое нельзя разобрать: не JSON,
        неизвестные поля, неверная структура.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Анкета корректна; возвращается нормализованной вместе с местом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileCheck'
        '400':
          description: Тело не разобрано (`validation_failed`, без `fields`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Анкета не прошла проверку. `code`: `validation_failed`,
            `place_not_found` (поле `place_id`), `birth_time_nonexistent` или
            `birth_time_ambiguous` (поле `time.value`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит частоты (`rate_limited`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Текущий принципал
      description: |
        Доступен любому посетителю (§15.2), всегда `200`. Без действующей
        cookie `__Host-lk_sid` — `anonymous`. Сессия заблокированного или
        привязанного к аккаунту доступа недействительна (§9.2) — тоже
        `anonymous`. Код целиком никогда не возвращается, только маска.
        Вариант `account` добавляется в срезе 7.
      responses:
        '200':
          description: Принципал текущей сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/code:
    post:
      tags: [auth]
      operationId: startCodeSession
      summary: Кодовый вход
      description: |
        Публичный, с лимитами попыток на IP и глобально (§10.3, «Перебор
        кодов»). Сервер нормализует ввод (регистр, пробелы, дефисы, похожие
        символы) и проверяет префикс, длину и контрольный символ (§10.1).
        Вход не создаёт заказ и не расходует доступ.

        Действующую сессию другого доступа сервер заменяет только при
        `replace_session: true`; иначе — `409 session_conflict`. Повтор кода
        того же доступа — `200` без конфликта. Любая ошибка оставляет
        текущую сессию без изменений.

        Использованный код даёт кодовую сессию и `order_id`; открыть заказ
        можно только с этой сессией (§9.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeLogin'
      responses:
        '200':
          description: Кодовая сессия выдана (или уже действует для этого доступа)
          headers:
            Set-Cookie:
              description: '`__Host-lk_sid`; HttpOnly, Secure, SameSite=Lax, Path=/'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSession'
        '400':
          description: Тело не разобрано (`validation_failed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Доступ привязан к аккаунту (`code_bound_to_account`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Действует сессия другого доступа, а `replace_session` не `true`
            (`session_conflict`). Текущая сессия не меняется.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `code_malformed` — ввод не разбирается как код 2.0, `detail`
            подсказывает про коды старого сайта (§26); `code_invalid` — единый
            ответ для неизвестного, не выпущенного, заблокированного кода и
            кода другого продукта.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит попыток (`rate_limited`)
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

components:
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: Имя проверки → результат
          additionalProperties:
            type: string
            enum: [ok, fail]

    PublicConfig:
      type: object
      additionalProperties: false
      required: [environment, features]
      properties:
        environment:
          type: string
          enum: [local, test, staging, production]
        features:
          $ref: '#/components/schemas/Features'

    Features:
      type: object
      additionalProperties: false
      description: Какие пользовательские сценарии сервер обслуживает сейчас
      required: [code_login, email_login, generation]
      properties:
        code_login:
          type: boolean
        email_login:
          type: boolean
        generation:
          type: boolean

    Place:
      type: object
      additionalProperties: false
      description: Справочное место; координаты и часовой пояс берёт сервер по `id`, клиент их не присылает
      required: [id, name, country, latitude, longitude, timezone]
      properties:
        id:
          type: string
        name:
          type: string
          description: Название на русском
        region:
          type: string
          description: Регион или область, если есть
        country:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: IANA, например Europe/Moscow

    PlaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Place'

    Profile:
      type: object
      additionalProperties: false
      description: Анкета рождения (§15.4); координаты и часовой пояс сервер берёт по `place_id`
      required: [name, birth_date, place_id, time]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: 1–60 символов Unicode после обрезки пробелов
        birth_date:
          type: string
          format: date
          description: YYYY-MM-DD, от 1900-01-01 до текущей московской даты
        place_id:
          type: string
          description: '`Place.id` из справочника'
        time:
          $ref: '#/components/schemas/BirthTime'

    BirthTime:
      description: Явный дискриминатор `kind` вместо пары «время + флаг неизвестности» (§15.4)
      oneOf:
        - $ref: '#/components/schemas/BirthTimeKnown'
        - $ref: '#/components/schemas/BirthTimeUnknown'
      discriminator:
        propertyName: kind
        mapping:
          known: '#/components/schemas/BirthTimeKnown'
          unknown: '#/components/schemas/BirthTimeUnknown'

    BirthTimeKnown:
      type: object
      additionalProperties: false
      required: [kind, value, source, accuracy_minutes]
      properties:
        kind:
          type: string
          enum: [known]
        value:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Местное время HH:MM
        source:
          type: string
          enum: [document, family, approximate]
        accuracy_minutes:
          type: integer
          enum: [0, 15, 30, 60]

    BirthTimeUnknown:
      type: object
      additionalProperties: false
      description: Время неизвестно; сервер считает источник `unknown` и погрешность 0
      required: [kind]
      properties:
        kind:
          type: string
          enum: [unknown]

    ProfileCheck:
      type: object
      additionalProperties: false
      required: [profile, place]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        place:
          $ref: '#/components/schemas/Place'

    CodeLogin:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Код как введён; нормализует сервер (§10.1)
        replace_session:
          type: boolean
          description: Пользователь явно согласился заменить действующую сессию другого доступа; отсутствие поля равно `false`

    Session:
      description: Принципал сессии (§9.1)
      oneOf:
        - $ref: '#/components/schemas/AnonymousSession'
        - $ref: '#/components/schemas/CodeSession'
      discriminator:
        propertyName: principal
        mapping:
          anonymous: '#/components/schemas/AnonymousSession'
          code: '#/components/schemas/CodeSession'

    AnonymousSession:
      type: object
      additionalProperties: false
      required: [principal]
      properties:
        principal:
          type: string
          enum: [anonymous]

    CodeSession:
      type: object
      additionalProperties: false
      required: [principal, expires_at, entitlement]
      properties:
        principal:
          type: string
          enum: [code]
        expires_at:
          type: string
          format: date-time
        entitlement:
          $ref: '#/components/schemas/CodeEntitlement'

    CodeEntitlement:
      description: Доступ кодовой сессии; `order_id` есть только у использованного
      oneOf:
        - $ref: '#/components/schemas/CodeEntitlementAvailable'
        - $ref: '#/components/schemas/CodeEntitlementConsumed'
      discriminator:
        propertyName: state
        mapping:
          available: '#/components/schemas/CodeEntitlementAvailable'
          consumed: '#/components/schemas/CodeEntitlementConsumed'

    CodeEntitlementAvailable:
      type: object
      additionalProperties: false
      required: [id, state, code_mask]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [available]
        code_mask:
          $ref: '#/components/schemas/CodeMask'

    CodeEntitlementConsumed:
      type: object
      additionalProperties: false
      required: [id, state, code_mask, order_id]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [consumed]
        code_mask:
          $ref: '#/components/schemas/CodeMask'
        order_id:
          type: string
          format: uuid
          description: Заказ, созданный по этому доступу

    CodeMask:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{4}$'
      description: Последние 4 символа нормализованного кода (§10.2)

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Текст на русском для показа пользователю
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
        fields:
          type: object
          description: Ошибки валидации по полям
          additionalProperties:
            type: string

    ErrorCode:
      type: string
      description: Стабильный машинный код ошибки (§15.3)
      enum:
        - internal_error
        - validation_failed
        - place_not_found
        - birth_time_nonexistent
        - birth_time_ambiguous
        - calculation_failed
        - unauthenticated
        - not_found
        - rate_limited
        - mail_unavailable
        - otp_invalid
        - otp_expired
        - otp_attempts_exceeded
        - code_malformed
        - code_invalid
        - code_bound_to_account
        - code_claimed_elsewhere
        - session_conflict
        - entitlement_used
        - entitlement_blocked
        - consent_outdated
        - idempotency_key_reused
        - files_not_ready
        - resume_not_allowed
